# ──────────────────────────────────────────────
# Checkpoint System — Docker Compose
# Target VPS: 1 CPU / 512 MB RAM / 6 GB SSD
# Total allocation: 0.9 CPU / 240 MB (leaves ~270 MB for OS + Docker)
# ──────────────────────────────────────────────

services:
  keydb:
    image: eqalpha/keydb:latest
    container_name: checkpoint-keydb-full
    # Порт НЕ пробрасывается на хост — API и parser подключаются по Docker network (keydb:6379)
    # Для отладки: docker exec checkpoint-keydb-full keydb-cli
    volumes:
      - keydb_data:/data
      - ./api/keydb.conf:/usr/local/etc/keydb/keydb.conf:ro
    command: keydb-server /usr/local/etc/keydb/keydb.conf
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 16M
    healthcheck:
      test: ["CMD", "keydb-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "2"
    networks:
      - checkpoint-network

  parser:
    build:
      context: ./parser
      dockerfile: Dockerfile
    container_name: checkpoint-parser-full
    environment:
      - KEYDB_HOST=keydb
      - KEYDB_PORT=6379
      - KEYDB_PASSWORD=${KEYDB_PASSWORD:-}
    depends_on:
      keydb:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 80M
        reservations:
          cpus: '0.05'
          memory: 32M
    volumes:
      - ./parser/logs:/app/logs
    networks:
      - checkpoint-network
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "2"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.prod
    container_name: checkpoint-api-full
    environment:
      - PORT=8080
      - KEYDB_HOST=keydb
      - KEYDB_PORT=6379
      - KEYDB_PASSWORD=${KEYDB_PASSWORD:-}
      - AUTH_USERNAME=${AUTH_USERNAME}
      - AUTH_PASSWORD=${AUTH_PASSWORD}
      - GIN_MODE=release
    depends_on:
      keydb:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 8M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "2"
    networks:
      - checkpoint-network

  angie:
    image: docker.angie.software/angie:latest
    container_name: checkpoint-angie-full
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./angie.loadbalancer.conf:/etc/angie/angie.conf:ro
      - angie_logs:/var/log/angie
      - acme_data:/var/lib/angie/acme
    depends_on:
      - api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 32M
        reservations:
          cpus: '0.05'
          memory: 8M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "2"
    networks:
      - checkpoint-network

volumes:
  keydb_data:
    driver: local
  angie_logs:
    driver: local
  acme_data:
    driver: local

networks:
  checkpoint-network:
    driver: bridge
